version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /z8ter-app
      - /z8ter/scaffold/create_project_template
      - /z8ter/cli/scaffold_dev/create_project_template
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
