name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade --editable ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Verify package build
        run: python -m build

      - name: Audit dependencies
        if: matrix.python-version == '3.14'
        run: python -m pip_audit --progress-spinner off

  frontend:
    name: Frontend (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - z8ter-app
          - z8ter/scaffold/create_project_template
          - z8ter/cli/scaffold_dev/create_project_template
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit
